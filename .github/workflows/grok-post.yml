name: Grok writes a Journal post

on:
  schedule:
    - cron: '17 1 * * 1,4' # Mondays and Thursdays, 09:17 SGT
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional topic for this post'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: grok-post
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ask Grok for a post
        id: grok
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
          AUTO_PUBLISH: ${{ vars.GROK_AUTO_PUBLISH || 'true' }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: node scripts/grok-post.mjs
      - name: Check the site still builds
        run: npm run build
      - name: Commit
        run: |
          git config user.name "Grok (Sculpt Cues)"
          git config user.email "grok-bot@users.noreply.github.com"
          git add src/content/blog
          git commit -m "Journal: ${{ steps.grok.outputs.title }}"
          git push

  deploy:
    needs: write
    uses: ./.github/workflows/deploy.yml
